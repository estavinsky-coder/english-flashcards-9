<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d4aff">
<title>כרטיסיות אנגלית כיתה ט׳</title>
<style>
:root{
  --bg:#f6f4ff; --card:#ffffff; --text:#1d1b2e; --muted:#6b6880; --line:#e3dff5;
  --brand:#6d4aff; --brand-ink:#ffffff; --good:#15803d; --good-bg:#dcfce7;
  --bad:#b91c1c; --bad-bg:#fee2e2; --tip:#fff4c2; --tip-line:#eed46a; --mark:#ffe58a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14131c; --card:#1f1d2b; --text:#f1effa; --muted:#a6a2c0; --line:#33304a;
    --brand:#9a85ff; --brand-ink:#14101f; --good:#86efac; --good-bg:#14331f;
    --bad:#fca5a5; --bad-bg:#3b1717; --tip:#3a3316; --tip-line:#7a6a22; --mark:#6b5a10;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:17px; line-height:1.5;
  padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
}
#app{max-width:520px;margin:0 auto;padding-top:14px}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1{font-size:26px;margin:4px 0 2px}
h2{font-size:19px;margin:22px 0 10px}
p{margin:6px 0}
small,.muted{color:var(--muted)}

.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.big{display:block;width:100%;min-height:58px;border-radius:16px;font-size:19px;font-weight:700;
  background:var(--brand);color:var(--brand-ink);margin-top:12px}
.big.alt{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.ghost{background:transparent;color:var(--muted);text-decoration:underline;margin:22px auto 0;display:block;padding:12px}

details.tab{background:transparent;border:0;padding:0;margin-top:14px}
details.tab>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:58px;
  background:var(--card);border:2px solid var(--brand);border-radius:16px;padding:10px 16px;font-size:19px}
details.tab>summary::-webkit-details-marker{display:none}
details.tab>summary small{font-weight:400;font-size:14px}
details.tab[open]>summary small{display:none}
.chev{font-style:normal;margin-inline-start:auto;transition:transform .25s}
details.tab[open] .chev{transform:rotate(180deg)}
details.tab[open] .tips{margin-top:8px;animation:pop .25s ease-out}
.tips{display:grid;gap:8px}
.tipc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-inline-start:5px solid var(--brand);border-radius:14px;padding:10px 12px}
.tipc>span{font-size:28px;line-height:1}
.tipc b{display:block}
.tipc .en b{display:inline}
.tipc b.in{color:var(--brand);text-decoration:underline}
.pairs{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px}
.pairs li{display:flex;justify-content:space-between;align-items:center;background:var(--bg);
  border-radius:10px;padding:4px 12px;font-size:18px;max-width:220px}
.pairs li .en{font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:6px;margin-bottom:12px}
.seg button{min-height:54px;border-radius:14px;font-size:19px;font-weight:700;background:transparent;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.panel[hidden]{display:none}
.panel{animation:pop .2s ease-out}
.tile{position:relative}
.tile.is-next{border-width:2px;border-color:var(--c);border-top-width:6px}
.badge{position:absolute;top:8px;left:8px;font-size:12px;font-weight:700;background:var(--bg);
  border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.badge.next{background:var(--c);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:16px;
  padding:12px;text-align:start;min-height:104px}
.tile .e{font-size:30px;line-height:1}
.tile b{display:block;margin-top:6px}
.tile small{display:block}
.tile .sample{display:block;font-size:13px;color:var(--muted);margin:2px 0 4px;text-align:left}
.mini{height:6px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c)}

details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
summary{font-weight:700;cursor:pointer}
details ul{margin:8px 0 2px;padding-inline-start:20px}
details li{margin:6px 0}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.icon{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c,var(--brand))}
.gname{font-size:14px;color:var(--muted);white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:22px;
  padding:20px 18px;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;animation:pop .25s ease-out;cursor:pointer}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}
.card .emo{font-size:64px;line-height:1}
.card .big-en{font-size:40px;font-weight:800}
.card .med-en{font-size:20px;font-weight:700;color:var(--muted)}
.card .he{font-size:32px;font-weight:800}
.hint{color:var(--muted);font-size:15px}
.speak{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:10px 16px;font-size:16px;min-height:44px}
.tipbox{background:var(--tip);border:1px solid var(--tip-line);border-radius:14px;padding:12px 14px;
  text-align:start;font-size:18px;width:100%}
.tipbox .tl{font-weight:700;margin-bottom:4px}
.tipbox div+div{margin-top:2px}
.tipbox bdi,.opt bdi{font-weight:700}
.ex{display:flex;gap:8px;align-items:center;justify-content:center;font-size:16px;color:var(--muted)}
mark{background:var(--mark);color:inherit;padding:0 3px;border-radius:4px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions button{min-height:60px;border-radius:16px;font-size:19px;font-weight:700}
.again{background:var(--bad-bg);color:var(--bad)}
.knew{background:var(--good-bg);color:var(--good)}
.actions button:disabled{opacity:.35;cursor:not-allowed}

.center{text-align:center}
.stars{font-size:48px;letter-spacing:6px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.chips span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:15px}
.timer{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums}

.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{min-height:58px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:18px;padding:8px 12px}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.fb{margin-top:12px}

.confetti{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fall 2.2s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>

<script>
/* ---------- DATA ---------- */
// Text rules: one short idea per line (\n). English words are auto-isolated by bidi(), so

const GROUPS = [

// [group, english, emoji, hebrew, example ({{word}} = highlighted), memory trick (lines split by \n)]
const W = [
 // reflex
 ['reflex','myself','🙋','אני עצמי / את עצמי','I made this cake {{myself}}.','my + self\nmy = שלי, self = עצמי'],

 ['reflex','themselves','🧑‍🤝‍🧑','הם / הן עצמם','They built the house {{themselves}}.','them + selves\n⚠️ לא theirselves!'],

 ['verbs','put off','⏳','לדחות','Don\'t {{put off}} your homework!','put = לשים, off = הצידה\nשמים בצד למחר ⏳'],
 ['verbs','seem','👁️','נראה ש…, נדמה','You {{seem}} tired today.','נשמע כמו see = לראות 👁️\nמה שאני רואה = מה שנראה לי'],
 ['verbs','take out','🥡','להוציא','Please {{take out}} the trash.','take = לקחת, out = החוצה\nכמו אוכל טייק-אווי 🥡'],
 ['verbs','try on','👗','למדוד (בגד)','Can I {{try on}} these jeans?','try = לנסות, on = על הגוף\nמנסים בגד על עצמך 👖'],

 // things

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = s => esc(s).replace(/\{\{(.+?)\}\}/g, '<mark>$1</mark>');
const plain = s => s.replace(/\{\{|\}\}/g, '');
const speakable = s => plain(s).replace(/[()…]/g, '').replace(/\s+/g, ' ').trim();
const en = (s, cls='') => `<span class="en ${cls}" dir="ltr">${esc(s)}</span>`;
// Wrap each English run in <bdi dir="ltr"> so mixed Hebrew/English text keeps its word order.
const LAT = /[A-Za-z][A-Za-z0-9'’+\/.,…?! -]*[A-Za-z0-9?!…]|[A-Za-z]/g;
function bidi(s){
  let out = '', last = 0;
  s.replace(LAT, (m, i) => { out += esc(s.slice(last, i)) + `<bdi dir="ltr">${esc(m)}</bdi>`; last = i + m.length; return m; });
  return out + esc(s.slice(last));
}
const lines = s => s.split('\n').map(l => `<div>${bidi(l)}</div>`).join('');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function speak(t){
  try { const u = new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
}
function confetti(){
  const e = ['🎉','⭐','✨','🎊','💜','🌟'];
  for(let i=0;i<24;i++){
    const s = document.createElement('span');
    s.className = 'confetti'; s.textContent = e[i % e.length];
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDelay = Math.random()*.6 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 3200);
  }
}
const groupWords = id => W.filter(w => w[0] === id);
const unknownIn = id => groupWords(id).filter(w => !known.has(w[1]));
function render(html){
  if (breakTimer){ clearInterval(breakTimer); breakTimer = null; }
  view.innerHTML = html;
  window.scrollTo(0, 0);
}

function startRound(gid){
  const pool = groupWords(gid);
  let list = pool.filter(w => !known.has(w[1])), review = false;
  if (!list.length){ list = shuffle(pool.slice()); review = true; }
  const queue = list.slice(0, ROUND);
  S = {gid, queue, total: queue.length, done: 0, again: 0, shown: false, review, started: false};
  intro();
}

function intro(){
  const g = G[S.gid];
  const chips = S.queue.map(w => `<span>${en(w[1])}</span>`).join('');
  render(`
    <div class="topbar"><button class="icon" data-act="home" aria-label="חזרה">✕</button><span class="gname">${g.emoji} ${esc(g.name)}</span></div>
    <section class="hero center" style="border-top:8px solid ${g.color}">
      <div style="font-size:56px">${g.emoji}</div>
      <h1>${esc(g.name)}</h1>
      ${S.review ? '<p class="muted">כבר ידעתם את כולן. זה סבב חזרה 💪</p>' : ''}
      <div class="tipbox"><div class="tl">💡 טיפ לנושא</div>${lines(g.tip)}</div>
      <p class="muted">${S.total} כרטיסים בסבב הזה:</p>
      <div class="chips">${chips}</div>
      <button class="big" data-act="begin">יאללה, מתחילים!</button>
    </section>`);
}

function startBreak(){
  let t = 60;
  const box = document.getElementById('brk');
  const tips = ['קום ומתח את הגוף 🙆','שתה כוס מים 💧','הסתכל מהחלון רחוק 🌳','נשום עמוק 5 פעמים 😮‍💨'];
  const draw = () => { box.innerHTML = `<div class="timer">${t}</div><p class="muted">${tips[Math.floor((60 - t) / 15) % tips.length]}</p>`; };
  draw();
  breakTimer = setInterval(() => {
    t--;
    if (t <= 0){ clearInterval(breakTimer); breakTimer = null; box.innerHTML = '<p><b>חזרנו! 💪</b></p>'; }
    else draw();
  }, 1000);
}

/* ---------- QUIZ ---------- */
function startQuiz(){
  const unk = shuffle(W.filter(w => !known.has(w[1])));
  const rest = shuffle(W.filter(w => known.has(w[1])));
  const items = unk.concat(rest).slice(0, 10);
  Q = {items: shuffle(items), i: 0, score: 0, answered: false, opts: [], wrong: []};
  quizQ();
}
function quizQ(){
  const w = Q.items[Q.i];
  if (!Q.opts.length){
    const others = shuffle(W.filter(x => x[3] !== w[3]));
    const seen = new Set([w[3]]), picks = [w];
    for (const o of others){ if (!seen.has(o[3])){ seen.add(o[3]); picks.push(o); } if (picks.length === 4) break; }
    Q.opts = shuffle(picks);
  }
  const opts = Q.opts.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}">${bidi(o[3])}</button>`).join('');
  render(`
    <div class="topbar"><button class="icon" data-act="home" aria-label="חזרה">✕</button>
      <div class="dots" style="flex:1"><small>שאלה ${Q.i + 1} מתוך ${Q.items.length} · ניקוד ${Q.score}</small></div></div>
    <section class="q">
      <div style="font-size:56px">${w[2]}</div>
      <div class="big-en" style="font-size:38px;font-weight:800">${en(w[1])}</div>
      <button class="speak" data-act="speak" data-t="${esc(speakable(w[1]))}">🔊 השמע</button>
      <p class="muted">מה המשמעות?</p>
      <div class="opts">${opts}</div>
      <div class="fb" id="fb"></div>
    </section>`);
}
function answer(i){
  if (Q.answered) return;
  Q.answered = true;
  const w = Q.items[Q.i], chosen = Q.opts[i], ok = chosen === w;
  const btns = view.querySelectorAll('.opt');
  Q.opts.forEach((o, k) => { if (o === w) btns[k].classList.add('right'); });
  if (!ok) btns[i].classList.add('wrong');
  if (ok){ Q.score++; known.add(w[1]); } else { known.delete(w[1]); Q.wrong.push(w); }
  saveKnown();
  const last = Q.i === Q.items.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="tipbox"><div class="tl">${ok ? '🎉 נכון!' : '🤏 כמעט.'} ${bidi(w[3])}</div><div class="tl">🧠 טריק זכירה</div>${lines(w[5])}</div>
    <button class="big" data-act="qnext">${last ? 'לתוצאות' : 'הבאה ←'}</button>`;
}
function quizEnd(){
  const n = Q.items.length, pct = Q.score / n;
  if (pct >= .7) confetti();
  const wrongs = Q.wrong.map(w => `<span>${en(w[1])} = ${bidi(w[3])}</span>`).join('');
  render(`
    <section class="hero center">
      <div class="stars">${pct >= .9 ? '🏆' : pct >= .7 ? '⭐⭐' : '⭐'}</div>
      <h1>${Q.score} מתוך ${n}</h1>
      <p>${pct >= .9 ? 'וואו, אלוף/ה! 🏆' : pct >= .7 ? 'כל הכבוד! 👏' : 'התחלה טובה. עוד סבב כרטיסים והציון יעלה 💪'}</p>
      ${wrongs ? `<p class="muted">מילים לחזרה:</p><div class="chips">${wrongs}</div>` : ''}
      <button class="big" data-act="quiz">🎮 משחק נוסף</button>
      <button class="big alt" data-act="home">🏠 לתפריט</button>
    </section>`);
}

/* ---------- ACTIONS ---------- */
const act = {
  home,
  auto(){ const g = GROUPS.find(g => unknownIn(g.id).length) || GROUPS[0]; startRound(g.id); },
  group(d){ tab = 'learn'; startRound(d.id); },
  tab(d){
    tab = d.tab;
    view.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    view.querySelector('#p-learn').hidden = tab !== 'learn';
    view.querySelector('#p-practice').hidden = tab !== 'practice';
  },
  begin(){ S.shown = false; card(); },
  flip(){ if (!S.shown){ S.shown = true; card(); } },
  knew(){
    if (!S.shown) return;
    const w = S.queue.shift(); known.add(w[1]); saveKnown();
    S.done++; S.shown = false;
    S.queue.length ? card() : roundEnd();
  },
  again(){
    if (!S.shown) return;
    const w = S.queue.shift(); known.delete(w[1]); saveKnown();
    S.again++; S.shown = false;
    S.queue.splice(Math.min(2, S.queue.length), 0, w);
    card();
  },
  speak(d){ speak(d.t); },
  break: startBreak,
  quiz(){ tab = 'practice'; startQuiz(); },
  opt(d){ answer(+d.i); },
  qnext(){ Q.i++; Q.answered = false; Q.opts = []; Q.i >= Q.items.length ? quizEnd() : quizQ(); },
  reset(){ if (confirm('למחוק את כל ההתקדמות ולהתחיל מחדש?')){ known = new Set(); saveKnown(); home(); } }
};
view.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = act[b.dataset.act];
  if (fn) fn(b.dataset);
});
view.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card')){ e.preventDefault(); act.flip(); }
});

home();
</script>
</body>
</html>
